name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, Windows, x64] # Lenovo ThinkPad T410
            os-name: windows
            c_compiler: cl
            cpp_compiler: cl
            arch: x64
          - os: ubuntu-24.04
            os-name: linux
            c_compiler: gcc
            cpp_compiler: g++
            arch: x64
            display: x11
          - os: ubuntu-24.04
            os-name: linux
            c_compiler: gcc
            cpp_compiler: g++
            arch: x64
            display: wayland
          - os: [self-hosted, macOS, x64] # 2015-MacBook-Air
            os-name: mac
            c_compiler: clang
            cpp_compiler: clang++
            arch: x64
            osx_deployment_target: "10.14.6"

    steps:
    - name: Clean & Clone
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: |
        rm -rf ./Roche-Limit
        git clone https://github.com/Liam-Weitzel/Roche-Limit Roche-Limit
        cd Roche-Limit
        git checkout "${{ github.sha }}"
        git submodule sync --recursive
        git submodule update --init --recursive --depth=1

    - name: Setup
      shell: bash
      run: |
        if [ "${{ matrix.os-name }}" = "linux" ]; then
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gcc \
            g++ \
            libx11-dev \
            xorg-dev \
            unzip \
            wget

          wget -q ${{ secrets.RESSPACKER_URL }} -O rrespacker.zip
          unzip -q rrespacker.zip -d ${{ github.workspace }}/client/libs/rrespacker/
          chmod +x ${{ github.workspace }}/client/libs/rrespacker/*

          wget -q ${{ secrets.STEAM_SDK_URL }} -O steam_sdk.zip
          unzip -q steam_sdk.zip -d ${{ github.workspace }}/libs/steam/

          if [ "${{ matrix.display }}" = "x11" ]; then
            sudo apt-get install -y \
              xvfb
          fi

          if [ "${{ matrix.display }}" = "wayland" ]; then
            sudo apt-get install -y \
              sway \
              xwayland \
              libegl1-mesa-dev \
              libwayland-dev \
              wayland-protocols \
              libxkbcommon-dev \
              libffi-dev \
              seatd

            # Get the correct XDG_RUNTIME_DIR
            export XDG_RUNTIME_DIR=/run/user/$(id -u)
            mkdir -p $XDG_RUNTIME_DIR
            chmod 700 $XDG_RUNTIME_DIR

            # Create seat group and add runner user
            sudo groupadd seat
            sudo usermod -aG seat runner

            # Start seatd daemon
            sudo /usr/sbin/seatd -g seat &
            export LIBSEAT_BACKEND=seatd

            # Create minimal Sway config
            printf "bar {\n    mode invisible\n    status_command \"\"\n    tray_output none\n}\n" > $XDG_RUNTIME_DIR/config

            # Export variables for subsequent steps
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> $GITHUB_ENV
            echo "WAYLAND_DISPLAY=wayland-1" >> $GITHUB_ENV
            echo "XDG_SESSION_TYPE=wayland" >> $GITHUB_ENV
            echo "WLR_NO_HARDWARE_CURSORS=1" >> $GITHUB_ENV
            echo "WLR_RENDERER=pixman" >> $GITHUB_ENV
            echo "DISPLAY=:0" >> $GITHUB_ENV
            echo "SWAYSOCK=$XDG_RUNTIME_DIR/sway-ipc.sock" >> $GITHUB_ENV
            echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/lib/wayland:/usr/lib/libxkbcommon:/usr/lib/libffi:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          fi
        fi
        if [ "${{ matrix.os-name }}" = "mac" ]; then
          if ! command -v brew &> /dev/null; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> ~/.zprofile
            eval "$(/opt/homebrew/bin/brew shellenv)"
          fi

          brew install \
            cmake \
            wget

          wget -q ${{ secrets.RESSPACKER_URL }} -O rrespacker.zip
          unzip -q rrespacker.zip -d ${{ github.workspace }}/client/libs/rrespacker/
          chmod +x ${{ github.workspace }}/client/libs/rrespacker/*

          wget -q ${{ secrets.STEAM_SDK_URL }} -O steam_sdk.zip
          unzip -q steam_sdk.zip -d ${{ github.workspace }}/libs/steam/
        fi
        if [ "${{ matrix.os-name }}" = "windows" ]; then
          /c/Users/runner/Downloads/wget.exe -q "${{ secrets.RESSPACKER_URL }}" -O rrespacker.zip
          unzip -oq rrespacker.zip -d "${{ github.workspace }}/client/libs/rrespacker/"

          /c/Users/runner/Downloads/wget.exe -q "${{ secrets.STEAM_SDK_URL }}" -O steam_sdk.zip
          unzip -oq steam_sdk.zip -d "${{ github.workspace }}/libs/steam/"
        fi

    - name: Build client
      working-directory: ${{ github.workspace }}/client
      shell: bash
      run: |
        mkdir build/
        cd build/
        cmake \
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }} \
        ${{ matrix.osx_deployment_target && format('-DCMAKE_OSX_DEPLOYMENT_TARGET={0}', matrix.osx_deployment_target) || '' }} \
        ${{ matrix.display == 'wayland' && '-DUSE_WAYLAND=ON -DUSE_X11=OFF' || '' }} \
        -S ..
        cmake --build . -j$(nproc) --verbose

    - name: Test Client (Linux)
      if: matrix.os-name == 'linux'
      shell: bash
      working-directory: ${{ github.workspace }}/client
      run: |
        if [ "${{ matrix.display }}" = "x11" ]; then
          xvfb-run ./prep_models
          pkill -9 Xvfb || true
          sleep 3
          xvfb-run -a ./client_test
        fi
        if [ "${{ matrix.display }}" = "wayland" ]; then
          # Start Sway in headless mode
          WLR_BACKENDS=headless sway --verbose --config $XDG_RUNTIME_DIR/config &
          sleep 10
          ./prep_models
          ./client_test
        fi

    - name: Test Client (Mac)
      if: matrix.os-name == 'mac'
      shell: bash
      working-directory: ${{ github.workspace }}/client
      run: |
        ./prep_models
        ./client_test

    - name: Test Client (Windows)
      if: matrix.os-name == 'windows'
      shell: cmd
      working-directory: ${{ github.workspace }}/client
      run: |
        prep_models.exe
        client_test.exe

    - name: Upload client artifacts
      uses: actions/upload-artifact@v4
      with:
        name: client-${{ matrix.os-name }}-${{ matrix.arch }}${{ matrix.os-name == 'linux' && format('-{0}', matrix.display) || '' }}
        path: |
          client/client
          client/client.exe
          client/resources.rres
          client/lib_client.so
          client/libsteam_api.so
          client/lib_client.dylib
          client/libsteam_api.dylib
          client/lib_client.dll
          client/steam_api64.dll
        if-no-files-found: warn

    - name: Build server
      shell: bash
      run: |
        cd "${{ github.workspace }}/server"
        mkdir build/
        cd build/
        cmake \
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }} \
        ${{ matrix.osx_deployment_target && format('-DCMAKE_OSX_DEPLOYMENT_TARGET={0}', matrix.osx_deployment_target) || '' }} \
        -S ..
        cmake --build . -j$(nproc) --verbose

    - name: Test Server (Linux)
      if: matrix.os-name == 'linux'
      shell: bash
      run: |
        echo "To be implemented"

    - name: Test Server (Mac)
      if: matrix.os-name == 'mac'
      shell: bash
      run: |
        echo "To be implemented"

    - name: Test Server (Windows)
      if: matrix.os-name == 'windows'
      shell: cmd
      run: |
        echo "To be implemented"

    - name: Upload server artifacts
      uses: actions/upload-artifact@v4
      with:
        name: server-${{ matrix.os-name }}-${{ matrix.arch }}${{ matrix.os-name == 'linux' && format('-{0}', matrix.display) || '' }}
        path: ${{ github.workspace }}/server/build/Makefile #dummy

    - name: Notify Discord
      shell: bash
      if: always()
      run: |
        curl -H "Content-Type: application/json" \
             -X POST \
             -d "{\"content\": \"Build for OS=${{ matrix.os-name }} ARCH=${{ matrix.arch }} finished with status: ${{ job.status }}.\"}" \
             "${{ secrets.DISCORD_WEBHOOK_URL }}"
