name: CMake on multiple platforms

# This workflow runs on self-hosted runners, which are personal machines.
#
# Do NOT add a pull_request or pull_request_target trigger. This repository is
# public, and a pull request from a fork would execute that fork's code on those
# machines. push only ever fires for pushes to this repository, so it stays safe
# for branches; a fork's own pushes trigger workflows in the fork, not here.
on:
  push:
    branches:
      - '**'

jobs:
  build-test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, Windows, X64] # Lenovo ThinkPad T410
            os-name: windows
            c_compiler: cl
            cpp_compiler: cl
            arch: x64
          - os: [self-hosted, Linux, X64, X11] # Liam-Desktop
            os-name: linux
            c_compiler: gcc
            cpp_compiler: g++
            arch: x64
            display: x11
          - os: [self-hosted, Linux, X64, Wayland] # Liam-Desktop
            os-name: linux
            c_compiler: gcc
            cpp_compiler: g++
            arch: x64
            display: wayland
          - os: [self-hosted, macOS, X64] # 2015-MacBook-Air
            os-name: mac
            c_compiler: clang
            cpp_compiler: clang++
            arch: x64

    steps:
    - name: Checkout
      shell: bash
      working-directory: ${{ github.workspace }}/..
      run: |
        if [ -d "Roche-Limit/.git" ]; then
          echo "Cached repo found, updating..."
          cd Roche-Limit
          git fetch origin "+refs/heads/*:refs/remotes/origin/*"
          git checkout "${{ github.sha }}"
        else
          echo "No cached repo, cloning fresh..."
          git clone https://github.com/Liam-Weitzel/Roche-Limit Roche-Limit
          cd Roche-Limit
          git checkout "${{ github.sha }}"
        fi
        
        echo "Checking submodules..."
        # Try submodule update with retries
        for i in 1 2 3; do
          echo "Attempt $i of 3"
          if git submodule sync --recursive && git submodule update --init --recursive --depth=1; then
            echo "Success!"
            exit 0
          fi
          echo "Failed, waiting before retry..."
          sleep 10
        done
        echo "All attempts failed"
        exit 1

    - name: Setup
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        AWS_DEFAULT_REGION: eu-central-1
      run: |
        if [ ! -f "rrespacker.zip" ]; then
          aws s3 cp "s3://${{ secrets.AWS_S3_BUCKET }}/rrespacker.zip" rrespacker.zip
        fi
        if [ ! -f "steam_sdk.zip" ]; then
          aws s3 cp "s3://${{ secrets.AWS_S3_BUCKET }}/steam_sdk.zip" steam_sdk.zip
        fi
        if [ "${{ matrix.os-name }}" = "windows" ]; then
          if [ ! -f "${{ github.workspace }}/client/libs/rrespacker/rrespacker.exe" ]; then
            unzip -oq rrespacker.zip 'rrespacker.exe' -d "${{ github.workspace }}/client/libs/rrespacker/"
          fi
          if [ ! -d "${{ github.workspace }}/libs/steam" ] || [ -z "$(ls -A ${{ github.workspace }}/libs/steam)" ]; then
            unzip -oq steam_sdk.zip -d "${{ github.workspace }}/libs/steam/"
          fi
        fi
        if [[ "${{ matrix.os-name }}" = "linux" || "${{ matrix.os-name }}" = "mac" ]]; then
          if [ ! -f "${{ github.workspace }}/client/libs/rrespacker/rrespacker" ]; then
            unzip -q rrespacker.zip -d "${{ github.workspace }}/client/libs/rrespacker/"
            chmod +x ${{ github.workspace }}/client/libs/rrespacker/*
          fi
          if [ ! -d "${{ github.workspace }}/libs/steam/redistributable_bin" ] || [ -z "$(ls -A ${{ github.workspace }}/libs/steam/redistributable_bin)" ]; then
            unzip -q steam_sdk.zip -d "${{ github.workspace }}/libs/steam/"
          fi
        fi

    - name: Build client
      working-directory: ${{ github.workspace }}/client
      shell: bash
      run: |
        mkdir -p build/
        cd build/
        cmake \
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }} \
        ${{ matrix.osx_deployment_target && format('-DCMAKE_OSX_DEPLOYMENT_TARGET={0}', matrix.osx_deployment_target) || '' }} \
        ${{ matrix.display == 'wayland' && '-DUSE_WAYLAND=ON -DUSE_X11=OFF' || '' }} \
        -S ..
        cmake --build . -j$(nproc) --verbose

    - name: Test client (Unix)
      if: matrix.os-name == 'linux' || matrix.os-name == 'mac'
      shell: bash
      working-directory: ${{ github.workspace }}/client
      run: |
        ./prep_models
        ./client_test

    - name: Test client (Windows)
      if: matrix.os-name == 'windows'
      shell: cmd
      working-directory: ${{ github.workspace }}/client
      run: |
        prep_models.exe
        client_test.exe

    - name: Zip client
      if: github.ref == 'refs/heads/main'
      shell: bash
      run: |
        files=()
        while IFS= read -r file; do
          files+=("$file")
        done < <(
          for f in client/client.exe client/client client/client_test.exe client/client_test client/resources.rres client/lib_client.so client/lib_client.dll client/lib_client.dylib client/libsteam_api.so client/libsteam_api.dll client/libsteam_api.dylib client/steam_appid.txt; do
            [[ -f $f ]] && echo "$f"
          done | sort -u
        )

        if [[ "${{ matrix.os-name }}" == "windows" ]]; then
          temp_files=()
          while IFS= read -r file; do
            temp_files+=("$file")
          done < <(printf '%s\n' "${files[@]}" | xargs -I{} cygpath -w "{}" | sort -u)
          files=("${temp_files[@]}")
        fi

        zip $([[ "${{ matrix.os-name }}" == "windows" ]] && echo "a") client-${{ matrix.os-name }}-${{ matrix.arch }}${{ matrix.os-name == 'linux' && format('-{0}', matrix.display) || '' }}-${{ github.sha }}.zip "${files[@]}"

    - name: Upload client
      if: github.ref == 'refs/heads/main'
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        AWS_DEFAULT_REGION: eu-central-1
      run: |
        aws s3 cp ./client-${{ matrix.os-name }}-${{ matrix.arch }}${{ matrix.os-name == 'linux' && format('-{0}', matrix.display) || '' }}-${{ github.sha }}.zip s3://${{ secrets.AWS_S3_BUCKET }}

    - name: Build server
      working-directory: ${{ github.workspace }}/server
      shell: bash
      run: |
        mkdir -p build/
        cd build/
        cmake \
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }} \
        ${{ matrix.osx_deployment_target && format('-DCMAKE_OSX_DEPLOYMENT_TARGET={0}', matrix.osx_deployment_target) || '' }} \
        -S ..
        cmake --build . -j$(nproc) --verbose

    - name: Test server (Unix)
      if: matrix.os-name == 'linux' || matrix.os-name == 'mac'
      shell: bash
      working-directory: ${{ github.workspace }}/server
      run: |
        echo "dummy"

    - name: Test server (Windows)
      if: matrix.os-name == 'windows'
      shell: cmd
      working-directory: ${{ github.workspace }}/server
      run: |
        echo dummy

    - name: Zip server
      if: github.ref == 'refs/heads/main'
      shell: bash
      run: |
        files=()
        while IFS= read -r file; do
          files+=("$file")
        done < <(
          for f in server/CMakeLists.txt; do
            [[ -f $f ]] && echo "$f"
          done | sort -u
        )

        if [[ "${{ matrix.os-name }}" == "windows" ]]; then
          temp_files=()
          while IFS= read -r file; do
            temp_files+=("$file")
          done < <(printf '%s\n' "${files[@]}" | xargs -I{} cygpath -w "{}" | sort -u)
          files=("${temp_files[@]}")
        fi

        zip $([[ "${{ matrix.os-name }}" == "windows" ]] && echo "a") server-${{ matrix.os-name }}-${{ matrix.arch }}${{ matrix.os-name == 'linux' && format('-{0}', matrix.display) || '' }}-${{ github.sha }}.zip "${files[@]}"

    - name: Upload server
      if: github.ref == 'refs/heads/main'
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        AWS_DEFAULT_REGION: eu-central-1
      run: |
        aws s3 cp ./server-${{ matrix.os-name }}-${{ matrix.arch }}${{ matrix.os-name == 'linux' && format('-{0}', matrix.display) || '' }}-${{ github.sha }}.zip s3://${{ secrets.AWS_S3_BUCKET }}

  notify-discord:
    needs: build-test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Discord
        shell: bash
        run: |
          # Get branch name and commit message
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          COMMIT_MESSAGE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}" \
            | jq -r '.commit.message' \
            | head -n1)

          # Set webhook URL based on branch
          if [[ "$BRANCH_NAME" == "main" ]] || [[ "$BRANCH_NAME" == "master" ]]; then
            WEBHOOK_URL="${{ secrets.DISCORD_MAIN_WEBHOOK_URL }}"
          else
            WEBHOOK_URL="${{ secrets.DISCORD_FEATURE_WEBHOOK_URL }}"
          fi

          # Set color based on build result
          if [ "${{ needs.build-test.result }}" == "success" ]; then
            COLOR="65280"  # Green
            STATUS="✅ Success"
          elif [ "${{ needs.build-test.result }}" == "failure" ]; then
            COLOR="16711680"  # Red
            STATUS="❌ Failed"
          else
            COLOR="16776960"  # Yellow
            STATUS="⚠️ Cancelled"
          fi

          # Create properly escaped JSON payload
          jq -n \
            --arg title "Build $STATUS" \
            --arg color "$COLOR" \
            --arg repo "${{ github.repository }}" \
            --arg branch "$BRANCH_NAME" \
            --arg commit "${GITHUB_SHA:0:7}" \
            --arg commit_url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
            --arg actor "${{ github.actor }}" \
            --arg message "$COMMIT_MESSAGE" \
            --arg timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              embeds: [{
                title: $title,
                color: ($color|tonumber),
                fields: [
                  {name: "Repository", value: $repo, inline: true},
                  {name: "Branch", value: $branch, inline: true},
                  {name: "Commit", value: "[\($commit)](\($commit_url))", inline: true},
                  {name: "Message", value: $message, inline: false},
                  {name: "Triggered by", value: $actor, inline: true}
                ],
                timestamp: $timestamp
              }]
            }' | curl -H "Content-Type: application/json" -X POST -d @- "$WEBHOOK_URL"
